<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#018d38">
  <meta name="page-title" content="feed_title">
  <title>Feed · Antioquia Natural</title>
  <link rel="stylesheet" href="css/main.css?v=5">
  <link rel="stylesheet" href="css/components.css?v=17">
  <link rel="stylesheet" href="css/animations.css?v=4">
  <link rel="stylesheet" href="css/feed.css?v=2">
  <link rel="prefetch" href="data/species.json" as="fetch">
  <link rel="prefetch" href="../data/translations.json" as="fetch">
</head>
<body>
  <div class="app-shell">

    <header class="app-header app-header--with-switcher">
      <span class="app-header__logo-plate">
        <img src="img/logo/logo_gobernacion.png" class="app-header__logo" alt="Gobernación de Antioquia">
      </span>
      <div class="app-header__title">
        <span data-i18n="feed_title">Feed</span>
      </div>

      <div class="view-switcher" role="tablist" aria-label="Modalidad de vista">
        <button class="view-switcher__btn active" data-view="reel" role="tab" aria-selected="true" aria-label="Vista carrete">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="4"/></svg>
        </button>
        <button class="view-switcher__btn" data-view="grid" role="tab" aria-selected="false" aria-label="Vista cuadrícula">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" aria-hidden="true"><rect x="2" y="2" width="9" height="9" rx="2.2"/><rect x="13" y="2" width="9" height="9" rx="2.2"/><rect x="2" y="13" width="9" height="9" rx="2.2"/><rect x="13" y="13" width="9" height="9" rx="2.2"/></svg>
        </button>
        <button class="view-switcher__btn" data-view="masonry" role="tab" aria-selected="false" aria-label="Vista Mosaico">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="2" y="2" width="9" height="20" rx="2.2"/><rect x="13" y="2" width="9" height="8" rx="2.2"/><rect x="13" y="12" width="9" height="10" rx="2.2"/></svg>
        </button>
      </div>

      <button class="app-header__lang" data-lang-toggle aria-label="Cambiar idioma">EN</button>
    </header>

    <!-- Filtro de fuente (acceso rápido) -->
    <div class="feed-sources" role="tablist" aria-label="Fuente de las fotos">
      <button class="feed-sources__btn feed-sources__btn--all active" data-source="all" role="tab" aria-selected="true" data-i18n="feed_source_all">Todo</button>
      <button class="feed-sources__btn feed-sources__btn--jpl" data-source="jpl" role="tab" aria-selected="false" data-i18n="feed_source_jpl">Jóvenes pa' Lante</button>
      <button class="feed-sources__btn feed-sources__btn--gc" data-source="gc" role="tab" aria-selected="false" data-i18n="feed_source_gc">Guarda Cuencas</button>
      <button class="feed-sources__btn feed-sources__btn--catalogo" data-source="catalogo" role="tab" aria-selected="false" data-i18n="feed_source_catalog">Catálogo</button>
    </div>

    <!-- Búsqueda (visible solo en cuadrícula / mosaico) -->
    <div class="feed-search" id="feed-search" hidden>
      <div class="search-bar">
        <svg class="search-bar__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input
          type="search"
          id="feed-search-input"
          class="search-bar__input"
          aria-label="Buscar en el feed"
          data-i18n-placeholder="search_placeholder"
          placeholder="Buscar especie o familia..."
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
        >
        <button class="search-bar__clear" id="feed-search-clear" aria-label="Limpiar búsqueda">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </div>

    <!-- Vista carrete (pantalla completa) -->
    <div class="reel-screen" id="view-reel">
      <div class="photo-reel photo-reel--vertical" id="feed-reel" aria-label="Feed en carrete"></div>
    </div>

    <!-- Vista cuadrícula -->
    <div class="photo-view" id="view-grid" hidden>
      <div class="photo-grid-3col" id="feed-grid" aria-label="Feed en cuadrícula"></div>
    </div>

    <!-- Vista mosaico -->
    <div class="photo-view" id="view-masonry" hidden>
      <div class="photo-masonry" id="feed-masonry" aria-label="Feed en mosaico"></div>
    </div>

    <a class="feed-modules-link" href="home.html" data-i18n="feed_modules" hidden>Ver todos los módulos</a>

    <!-- Modal / visor -->
    <div class="modal-overlay" id="modal-overlay"></div>
    <div class="modal-sheet" id="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="modal-name">
      <div class="modal-photo" id="modal-photo">
        <button class="modal-close" data-modal-close aria-label="Cerrar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
        <img id="modal-img" src="" alt="" loading="lazy">
        <div class="modal-photo__placeholder" id="modal-placeholder" style="display:none"></div>
        <div class="modal-dots" id="modal-dots" style="display:none"></div>
        <div class="modal-counter" id="modal-counter" style="display:none"></div>
        <div class="gallery-expand-hint" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/></svg>
        </div>
      </div>
      <div class="modal-body">
        <div class="modal-handle" aria-hidden="true"></div>
        <div class="modal-name" id="modal-name"></div>
        <div class="modal-sci" id="modal-sci"></div>
        <div class="modal-badges" id="modal-badges"></div>
        <p class="modal-desc" id="modal-desc"></p>
        <div class="modal-credit" id="modal-credit">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M6 20v-2a6 6 0 0112 0v2"/></svg>
          <span id="modal-credit-text"></span>
        </div>
        <a class="feed-ficha-link" id="modal-ficha-link" href="#" hidden>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
          <span data-i18n="feed_view_ficha">Ver ficha</span>
        </a>
      </div>
    </div>

    <!-- Visor de pantalla completa (mismo patrón que especie.html) -->
    <div class="lightbox" id="feed-lightbox" hidden>
      <button class="lightbox__close" id="feed-lightbox-close" aria-label="Cerrar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <div class="lightbox__stage" id="feed-lightbox-stage"></div>
      <div class="lightbox__dots gallery-dots" id="feed-lightbox-dots" style="display:none"></div>
      <div class="lightbox__counter" id="feed-lightbox-counter" style="display:none"></div>
      <div class="lightbox__caption" id="feed-lightbox-caption" style="display:none"></div>
    </div>

    <nav class="bottom-bar" aria-label="Navegación principal">
      <button class="bottom-bar__btn active" aria-label="Inicio">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span data-i18n="home">Inicio</span>
      </button>
      <button class="bottom-bar__btn" onclick="window.location.href='biodiversidad.html'" aria-label="Biodiversidad">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span data-i18n="nav_bio">Bio</span>
      </button>
      <button class="bottom-bar__btn" onclick="window.location.href='../agua/index.html'" aria-label="Agua">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2C6 8 4 12 4 15a8 8 0 0016 0c0-3-2-7-8-13z"/></svg>
        <span data-i18n="nav_agua">Agua</span>
      </button>
      <button class="bottom-bar__btn" onclick="window.location.href='../comunidad/index.html'" aria-label="Comunidad">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
        <span data-i18n="com_titulo">Comunidad</span>
      </button>
    </nav>
  </div>

  <script src="js/i18n.js?v=3"></script>
  <script src="js/data.js?v=10"></script>
  <script src="js/nav.js?v=3"></script>
  <script src="js/app.js?v=7"></script>
  <script src="js/feed-data.js?v=1"></script>
  <script src="js/feed.js?v=2"></script>
</body>
</html>
