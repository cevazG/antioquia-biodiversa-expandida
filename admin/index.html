<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — Antioquia Natural</title>
<link rel="stylesheet" href="css/admin.css?v=2">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-card__logo">🌿</div>
    <h2>Antioquia Natural</h2>
    <p class="login-card__sub">Panel de curación de contenido</p>
    <form id="loginForm">
      <input type="text" id="usuario" placeholder="Usuario" required autofocus autocomplete="username">
      <input type="password" id="password" placeholder="Contraseña" required autocomplete="current-password">
      <!-- Site key de PRUEBA de Google (no es secreto) — reemplazar por la real
           registrada para el dominio final antes de producción. -->
      <div class="g-recaptcha" data-sitekey="6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI"></div>
      <p class="error-msg" id="errorMsg" style="display:none"></p>
      <button type="submit" class="btn btn--primary btn--full">Ingresar</button>
    </form>
  </div>
</div>

<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<script src="js/api.js"></script>
<script src="index.js"></script>
</body>
</html>
