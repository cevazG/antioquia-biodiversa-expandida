<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#3561ab">
  <title>Galería Guarda Cuencas · Antioquia</title>
  <link rel="stylesheet" href="../../biodiversidad/css/main.css?v=6">
  <link rel="stylesheet" href="../../biodiversidad/css/components.css?v=21">
  <link rel="stylesheet" href="../../biodiversidad/css/animations.css?v=4">
  <link rel="stylesheet" href="galeria.css?v=10">
</head>
<body>
  <div class="app-shell">

    <header class="app-header app-header--with-switcher">
      <button class="app-header__back" onclick="history.back()" aria-label="Volver">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5m0 0l7 7m-7-7l7-7"/></svg>
      </button>
      <div class="app-header__title">
        <span data-i18n="gc_fotos_titulo">Galería de Cuencas</span>
      </div>

      <!-- Selector de modalidad de vista, junto al selector de idioma -->
      <div class="view-switcher" role="tablist" aria-label="Modalidad de vista">
        <button class="view-switcher__btn" data-view="reel" role="tab" aria-selected="false" aria-label="Vista carrete">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="4"/></svg>
        </button>
        <button class="view-switcher__btn active" data-view="grid" role="tab" aria-selected="true" aria-label="Vista lista">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" aria-hidden="true"><rect x="2" y="2" width="9" height="9" rx="2.2"/><rect x="13" y="2" width="9" height="9" rx="2.2"/><rect x="2" y="13" width="9" height="9" rx="2.2"/><rect x="13" y="13" width="9" height="9" rx="2.2"/></svg>
        </button>
        <button class="view-switcher__btn" data-view="masonry" role="tab" aria-selected="false" aria-label="Vista Mosaico">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="2" y="2" width="9" height="20" rx="2.2"/><rect x="13" y="2" width="9" height="8" rx="2.2"/><rect x="13" y="12" width="9" height="10" rx="2.2"/></svg>
        </button>
      </div>

      <button class="app-header__lang" data-lang-toggle style="border-color:#3561ab;color:#3561ab;">EN</button>
    </header>

    <!-- Context bar -->
    <div class="gallery-context" id="gallery-context">
      <div class="gallery-context__title" data-i18n="gc_fotos_titulo">Galería de Cuencas</div>
      <div class="gallery-context__sub" id="gallery-sub">—</div>
    </div>

    <!-- Toolbar: mes + subregión -->
    <div class="gallery-toolbar" id="gallery-toolbar">
      <div class="month-row" id="month-filters" role="group" aria-label="Filtrar por mes">
        <!-- month chips injected by JS -->
      </div>
      <div class="filter-row" id="subregion-filters" role="group" aria-label="Filtrar por subregión">
        <!-- subregion chips injected by JS -->
      </div>
    </div>

    <!-- Vista carrete (pantalla completa) -->
    <div class="reel-screen" id="view-reel" hidden>
      <div class="photo-reel photo-reel--vertical" id="gc-reel" aria-label="Cuencas en carrete"></div>
    </div>

    <!-- Vista lista (la que ya existía) -->
    <div class="photo-view" id="view-grid">
      <main>
        <div class="photo-list" id="photo-list"></div>
      </main>
    </div>

    <!-- Vista mosaico -->
    <div class="photo-view" id="view-masonry" hidden>
      <div class="photo-masonry" id="gc-masonry" aria-label="Cuencas en mosaico"></div>
    </div>

  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal-overlay" onclick="closeModal()"></div>
  <div class="modal-sheet" id="modal-sheet" role="dialog" aria-modal="true">
    <div class="modal-photo" id="modal-photo">
      <button class="modal-close" onclick="closeModal()" aria-label="Cerrar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <img id="modal-img" src="" alt="" loading="lazy">
      <div class="modal-photo__placeholder" id="modal-placeholder" style="display:none"><img src="img/icons/guarda-cuencas.svg" alt="" class="modal-photo__placeholder-icon"></div>
    </div>
    <div class="modal-body">
      <div class="modal-handle" aria-hidden="true"></div>
      <div class="modal-title"  id="modal-title"></div>
      <div class="modal-badges" id="modal-badges"></div>
      <p class="modal-desc"    id="modal-desc"></p>
      <div class="modal-credit" id="modal-credit">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M6 20v-2a6 6 0 0112 0v2"/></svg>
        <span id="modal-credit-text"></span>
      </div>
    </div>
  </div>

  <script src="../../biodiversidad/js/i18n.js"></script>
  <script src="galeria.js?v=6"></script>
</body>
</html>
