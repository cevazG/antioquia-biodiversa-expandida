<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#3561ab">
  <title>Cuencas Hídricas · Antioquia</title>
  <link rel="stylesheet" href="../biodiversidad/css/main.css?v=4">
  <link rel="stylesheet" href="../biodiversidad/css/components.css?v=4">
  <link rel="stylesheet" href="../biodiversidad/css/animations.css?v=4">
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="mapa.css?v=2">
</head>
<body>
<div class="agua-map-page">

  <div class="map-header">
    <button class="map-header__back" onclick="history.back()" aria-label="Volver">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5m0 0l7 7m-7-7l7-7"/></svg>
    </button>
    <div>
      <div class="map-header__title" data-i18n="agua_cuencas_map_titulo">Cuencas Hídricas</div>
      <div class="map-header__subtitle" data-i18n="agua_cuencas_map_sub">Toca una cuenca para ver su información</div>
    </div>
    <button data-lang-toggle style="background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.4);color:white;padding:4px 10px;border-radius:20px;font-size:0.78rem;font-weight:700;cursor:pointer;font-family:inherit;">EN</button>
  </div>

  <div class="map-wrap">
    <div id="map"></div>

    <div class="map-floating-controls">
      <div class="layer-mode-toggle" id="layer-mode-toggle">
        <button data-mode="rios" data-i18n="agua_modo_rios">Ríos</button>
        <button data-mode="todo" class="active" data-i18n="agua_modo_todo">Ríos + áreas</button>
      </div>
      <button class="legend-btn" id="legend-btn" aria-label="Ver leyenda de niveles" data-i18n="agua_leyenda_btn">
        ℹ️ Niveles
      </button>
    </div>
  </div>

  <div class="cuencas-chip-row" id="cuencas-chip-row" role="region" aria-label="Mostrar u ocultar cuencas"></div>

  <!-- Panel de leyenda -->
  <div class="cuenca-overlay" id="legend-overlay"></div>
  <div class="cuenca-sheet legend-sheet" id="legend-sheet" role="dialog" aria-modal="true" aria-labelledby="legend-title">
    <div class="cuenca-sheet__handle"></div>
    <button class="cuenca-sheet__close" id="legend-close" aria-label="Cerrar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <div class="cuenca-sheet__body">
      <h2 class="cuenca-sheet__name" id="legend-title" data-i18n="agua_leyenda_titulo">Niveles de clasificación hidrográfica</h2>
      <p class="cuenca-sheet__desc" data-i18n="agua_leyenda_desc">Colombia clasifica sus cuencas en 6 niveles jerárquicos (Decreto 1640 de 2012, IDEAM). Este mapa muestra los niveles 1 a 3.</p>
      <div id="legend-list"></div>
      <h3 class="legend-subtitle" data-i18n="agua_leyenda_zonas_titulo">Zonas hidrográficas en este mapa</h3>
      <div id="legend-zonas"></div>
    </div>
  </div>

  <!-- Panel de información de cuenca (bottom sheet) -->
  <div class="cuenca-overlay" id="cuenca-overlay"></div>
  <div class="cuenca-sheet" id="cuenca-sheet" role="dialog" aria-modal="true" aria-labelledby="cuenca-sheet-name">
    <div class="cuenca-sheet__handle"></div>
    <button class="cuenca-sheet__close" id="cuenca-sheet-close" aria-label="Cerrar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <div class="cuenca-sheet__body">
      <div class="cuenca-sheet__badges" id="cuenca-sheet-badges"></div>
      <h2 class="cuenca-sheet__name" id="cuenca-sheet-name">—</h2>
      <p class="cuenca-sheet__desc" id="cuenca-sheet-desc">—</p>
      <div class="cuenca-sheet__meta" id="cuenca-sheet-meta"></div>
      <div class="cuenca-sheet__subregiones" id="cuenca-sheet-subregiones"></div>
    </div>
  </div>

  <nav class="bottom-bar" aria-label="Navegación">
    <button class="bottom-bar__btn" onclick="window.location.href='../biodiversidad/home.html'">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span data-i18n="home">Inicio</span>
    </button>
    <button class="bottom-bar__btn" onclick="window.location.href='../biodiversidad/biodiversidad.html'">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <span data-i18n="nav_bio">Bio</span>
    </button>
    <button class="bottom-bar__btn active">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2C6 8 4 12 4 15a8 8 0 0016 0c0-3-2-7-8-13z"/></svg>
      <span data-i18n="nav_agua">Agua</span>
    </button>
    <button class="bottom-bar__btn" onclick="window.location.href='../comunidad/index.html'">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
      <span data-i18n="com_titulo">Comunidad</span>
    </button>
  </nav>
</div>

<!-- Leaflet JS -->
<script src="../biodiversidad/js/i18n.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="mapa.js"></script>
</body>
</html>
