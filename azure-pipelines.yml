# azure-pipelines.yml
# CI/CD — Antioquia Natural
# Requiere configurar en Azure DevOps:
#   - Service connection SonarQube: nombre exacto en SONARQUBE_SERVICE_CONNECTION
#   - Service connection Docker Registry: nombre exacto en DOCKER_REGISTRY_SERVICE_CONNECTION
#   - Service connection SSH Dev:  nombre exacto en SSH_DEV_SERVICE_CONNECTION
#   - Service connection SSH Prod: nombre exacto en SSH_PROD_SERVICE_CONNECTION
#   - Variable group "antioquia-natural-secrets" con: SERVER_DEV_USER, SERVER_DEV_HOST,
#     SERVER_PROD_USER, SERVER_PROD_HOST, APP_PATH (ruta de docker-compose.yml en el servidor)
#
# Despliegue vía Docker: la etapa BuildImage construye la imagen, la escanea
# con Trivy y la publica en el registry; DeployDev/DeployProd solo hacen
# `docker compose pull && up -d` sobre el docker-compose.yml ya presente en
# cada servidor (ver README.md § Despliegue en producción).

trigger:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: ubuntu-latest

variables:
  NODE_VERSION: '22.x'
  WORKING_DIR: 'backend'
  SONARQUBE_SERVICE_CONNECTION: 'SonarQube-AntioquiaNatural'
  DOCKER_REGISTRY_SERVICE_CONNECTION: 'ACR-AntioquiaNatural' # placeholder — ajustar cuando TI confirme el registry
  IMAGE_REPOSITORY: '<acr-name>.azurecr.io/antioquia-natural' # placeholder — ajustar cuando TI confirme el registry
  SSH_DEV_SERVICE_CONNECTION:  'SSH-Dev-AntioquiaNatural'
  SSH_PROD_SERVICE_CONNECTION: 'SSH-Prod-AntioquiaNatural'

# ─────────────────────────────────────────────
# STAGE 1 — Integración continua (CI)
# Ejecuta en todas las ramas
# ─────────────────────────────────────────────
stages:

- stage: CI
  displayName: 'CI — Lint, Tests y Cobertura'
  jobs:

  - job: Build
    displayName: 'Instalar, lintear y probar'
    steps:

    - task: NodeTool@0
      displayName: 'Instalar Node.js $(NODE_VERSION)'
      inputs:
        versionSpec: $(NODE_VERSION)

    - task: Npm@1
      displayName: 'npm install'
      inputs:
        command: install
        workingDir: $(WORKING_DIR)

    - task: Npm@1
      displayName: 'npm audit — dependencias con CVE Alta o Crítica fallan el build'
      inputs:
        command: custom
        workingDir: $(WORKING_DIR)
        customCommand: audit --audit-level=high --omit=dev

    - task: Npm@1
      displayName: 'Lint (ESLint)'
      inputs:
        command: custom
        workingDir: $(WORKING_DIR)
        customCommand: run lint

    - task: Npm@1
      displayName: 'SAST — ESLint-security (0 errores requeridos)'
      inputs:
        command: custom
        workingDir: $(WORKING_DIR)
        customCommand: run lint:security

    - script: |
        pip install semgrep --quiet
        semgrep \
          --config p/nodejs \
          --config p/owasp-top-ten \
          --config ../.semgrep.yml \
          src/ \
          --json \
          --output $(Build.ArtifactStagingDirectory)/semgrep-report.json \
          --error
      workingDirectory: $(WORKING_DIR)
      displayName: 'SAST — Semgrep (p/nodejs + p/owasp-top-ten + reglas locales)'

    - task: PublishBuildArtifacts@1
      displayName: 'Publicar reporte Semgrep'
      condition: always()
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/semgrep-report.json'
        ArtifactName: semgrep-sast

    - task: Npm@1
      displayName: 'Tests con cobertura'
      inputs:
        command: custom
        workingDir: $(WORKING_DIR)
        customCommand: run test:coverage

    - task: PublishTestResults@2
      displayName: 'Publicar resultados JUnit'
      condition: always()
      inputs:
        testResultsFormat: JUnit
        testResultsFiles: '$(WORKING_DIR)/coverage/junit.xml'
        mergeTestResults: true
        testRunTitle: 'Jest — Antioquia Natural'

    - task: PublishCodeCoverageResults@2
      displayName: 'Publicar cobertura'
      inputs:
        summaryFileLocation: '$(WORKING_DIR)/coverage/coverage-summary.json'

    - task: SonarQubePrepare@6
      displayName: 'SonarQube — preparar análisis'
      inputs:
        SonarQube: $(SONARQUBE_SERVICE_CONNECTION)
        scannerMode: CLI
        configMode: manual
        cliProjectKey: antioquia-natural-backend
        cliProjectName: 'Antioquia Natural — Backend'
        cliSources: '$(WORKING_DIR)/src'
        extraProperties: |
          sonar.exclusions=**/node_modules/**,**/coverage/**,**/__tests__/**
          sonar.javascript.lcov.reportPaths=$(WORKING_DIR)/coverage/lcov.info
          sonar.testExecutionReportPaths=$(WORKING_DIR)/coverage/junit.xml

    - task: SonarQubeAnalyze@6
      displayName: 'SonarQube — ejecutar análisis'

    - task: SonarQubePublish@6
      displayName: 'SonarQube — publicar resultado'
      inputs:
        pollingTimeoutSec: 300

# ─────────────────────────────────────────────
# STAGE 2 — Construir, escanear y publicar la imagen Docker
# Solo en develop/main (no en cada rama de feature)
# ─────────────────────────────────────────────
- stage: BuildImage
  displayName: 'Build, escaneo y push de imagen Docker'
  dependsOn: CI
  condition: and(succeeded(), in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/develop'))

  jobs:
  - job: BuildImage
    displayName: 'docker build + Trivy + push'
    steps:

    - task: Docker@2
      displayName: 'Build de la imagen'
      inputs:
        command: build
        Dockerfile: 'Dockerfile'
        buildContext: '.'
        repository: $(IMAGE_REPOSITORY)
        tags: |
          $(Build.BuildId)

    - script: |
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
        trivy image \
          --severity HIGH,CRITICAL \
          --exit-code 1 \
          $(IMAGE_REPOSITORY):$(Build.BuildId)
      displayName: 'SAST de imagen — Trivy (falla en vulnerabilidad Alta o Crítica)'

    - task: Docker@2
      displayName: 'Push de la imagen al registry'
      inputs:
        command: push
        containerRegistry: $(DOCKER_REGISTRY_SERVICE_CONNECTION)
        repository: $(IMAGE_REPOSITORY)
        tags: |
          $(Build.BuildId)

# ─────────────────────────────────────────────
# STAGE 3 — Deploy a Dev
# Solo en la rama develop
# ─────────────────────────────────────────────
- stage: DeployDev
  displayName: 'Deploy → Dev'
  dependsOn: BuildImage
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
  variables:
    - group: antioquia-natural-secrets

  jobs:
  - deployment: DeployDev
    displayName: 'Desplegar contenedor en servidor Dev'
    environment: Dev
    strategy:
      runOnce:
        deploy:
          steps:

          - task: SSH@0
            displayName: 'docker compose pull + up en Dev'
            inputs:
              sshServiceConnection: $(SSH_DEV_SERVICE_CONNECTION)
              runOptions: commands
              commands: |
                cd $(APP_PATH) &&
                export IMAGE_TAG=$(Build.BuildId) &&
                docker compose pull &&
                docker compose up -d
              failOnStdErr: false

# ─────────────────────────────────────────────
# STAGE 4 — Deploy a Producción
# Solo en la rama main · requiere aprobación manual
# ─────────────────────────────────────────────
- stage: DeployProd
  displayName: 'Deploy → Producción'
  dependsOn: BuildImage
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  variables:
    - group: antioquia-natural-secrets

  jobs:
  - deployment: DeployProd
    displayName: 'Desplegar contenedor en servidor Producción'
    environment: Produccion   # La aprobación manual se configura en este environment en Azure DevOps
    strategy:
      runOnce:
        deploy:
          steps:

          - task: SSH@0
            displayName: 'docker compose pull + up en Producción'
            inputs:
              sshServiceConnection: $(SSH_PROD_SERVICE_CONNECTION)
              runOptions: commands
              commands: |
                cd $(APP_PATH) &&
                export IMAGE_TAG=$(Build.BuildId) &&
                docker compose pull &&
                docker compose up -d
              failOnStdErr: false
