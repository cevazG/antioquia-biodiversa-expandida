<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Mapa de Ecosistemas · Antioquia</title>
  <link rel="stylesheet" href="../biodiversidad/css/main.css?v=5">

  <link rel="stylesheet" href="ecosistemas_mapa.css">

<body>
  <div class="eco-map-page">

    <div class="eco-map-header">
      <button class="eco-map-header__back" onclick="window.location.href='ecosistemas.html'" aria-label="Volver">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5m0 0l7 7m-7-7l7-7"/></svg>
      </button>
      <div>
        <div class="eco-map-header__title" data-i18n="ecosystems_map_title">Mapa de Ecosistemas</div>
        <div class="eco-map-header__subtitle" data-i18n="ecosystems_map_instruction">Toca un punto para conocer ese ecosistema</div>
      </div>
      <button data-lang-toggle style="background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.4);color:white;padding:4px 10px;border-radius:20px;font-size:0.78rem;font-weight:700;cursor:pointer;font-family:inherit;">EN</button>
    </div>

    <div id="map"></div>

    <div class="eco-map-counter" id="eco-map-counter">— sitios</div>

    <nav class="bottom-bar" aria-label="Navegación principal">
      <button class="bottom-bar__btn" onclick="window.location.href='../biodiversidad/home.html'" aria-label="Inicio">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>

      </button>
      <button class="bottom-bar__btn" onclick="window.location.href='../biodiversidad/biodiversidad.html'" aria-label="Biodiversidad">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span>Bio</span>
      </button>
      <button class="bottom-bar__btn active" onclick="window.location.href='index.html'" aria-label="Agua">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2C6 8 4 12 4 15a8 8 0 0016 0c0-3-2-7-8-13z"/></svg>

      </button>
      <button class="bottom-bar__btn" onclick="window.location.href='../comunidad/index.html'" aria-label="Comunidad">

      </button>

  </div>

  <script src="../biodiversidad/js/i18n.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
